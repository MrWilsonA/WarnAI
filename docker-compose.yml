services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_DB: ${DB_DATABASE:-warnai}, POSTGRES_USER: ${DB_USERNAME:-warnai_user}, POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis: {image: redis:7-alpine, ports: ["6379:6379"]}
  ai-engine:
    build: {context: ./ai-engine-python, dockerfile: ../docker/python-engine/Dockerfile}
    ports: ["8001:8001"]
    depends_on: [postgres, redis]
  laravel-app:
    build: {context: ./backend-laravel, dockerfile: ../docker/laravel/Dockerfile}
    environment: {APP_ENV: local, APP_DEBUG: "true", AI_ENGINE_URL: http://ai-engine:8001}
    depends_on: [ai-engine, postgres, redis]
  nginx:
    image: nginx:alpine
    ports: ["80:80"]
    volumes: [./backend-laravel:/var/www/html:ro, ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [laravel-app]
volumes: {pgdata: {}}
