<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WarnAI Workspace Intelligence</title><style>body{margin:0;background:#0b1020;color:#e9eefc;font:15px system-ui}main{max-width:1100px;margin:auto;padding:48px 24px}.brand{color:#75a7ff;font-weight:700;letter-spacing:.08em}.hero{display:flex;justify-content:space-between;align-items:end;gap:30px}.hero h1{font-size:48px;line-height:1.05;margin:12px 0}.muted{color:#91a0bf}.card{background:#151d33;border:1px solid #283653;border-radius:18px;padding:24px;margin-top:24px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric{background:#10172a;padding:18px;border-radius:12px}.metric b{display:block;font-size:25px;margin-top:4px}button{background:#75a7ff;border:0;border-radius:9px;padding:12px 18px;font-weight:700;cursor:pointer}input{background:#0e1528;color:white;border:1px solid #30405f;border-radius:9px;padding:12px;width:70%;margin-right:8px}.result{border-top:1px solid #2a3955;padding:14px 0}.pill{color:#8de4b5;font-size:12px}@media(max-width:700px){.hero{display:block}.grid{grid-template-columns:repeat(2,1fr)}input{width:55%}}</style></head><body><main><div class="brand">WARNAI / LOCAL INTELLIGENCE</div><div class="hero"><div><h1>Understand every<br>workspace.</h1><p class="muted">Private normalization, semantic retrieval, and analytics for your repository.</p></div><form id="upload"><input type="file" id="file" required><button>Index workspace</button></form></div><section class="card"><div class="grid"><div class="metric">Documents<b id="docs">0</b></div><div class="metric">Queries<b id="queries">0</b></div><div class="metric">Tokens<b id="tokens">0</b></div><div class="metric">Status<b class="pill">● LOCAL</b></div></div></section><section class="card"><form id="search"><input id="q" placeholder="Ask your workspace..." required><button>Search</button></form><div id="results" class="muted" style="margin-top:18px">Index files, then search across normalized Markdown.</div></section></main><script>const $=id=>document.getElementById(id);async function refresh(){let r=await fetch('/analytics').then(x=>x.json());$('docs').textContent=r.documents;$('queries').textContent=r.queries;$('tokens').textContent=r.estimated_tokens}$('upload').onsubmit=async e=>{e.preventDefault();let f=new FormData();f.append('file',$('file').files[0]);await fetch('/normalize',{method:'POST',body:f});await refresh()};$('search').onsubmit=async e=>{e.preventDefault();let r=await fetch('/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:$('q').value})}).then(x=>x.json());$('results').innerHTML=r.results.map(x=>`<div class="result"><b>${x.path}</b> <span class="pill">score ${x.score}</span><p class="muted">${x.markdown.slice(0,260).replaceAll('<','&lt;')}...</p></div>`).join('')||'No relevant context found';await refresh()};refresh()</script></body></html>
